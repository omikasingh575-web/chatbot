
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omni AI - Groq Chatbot</title>

<!-- Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
  --bg: #0b0d12;
  --panel: #11141c;
  --panel2: #181c27;
  --border: #252a38;
  --text: #f3f4f8;
  --muted: #9299aa;
  --accent: #8b72ff;
  --accent2: #6c53e9;
  --user: #29243e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
}

button, input, textarea, select {
  font: inherit;
}

button { cursor: pointer; }

.app {
  height: 100vh;
  display: flex;
}

/* SIDEBAR */

.sidebar {
  width: 265px;
  background: #0e1017;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 25px;
  font-size: 21px;
  font-weight: 800;
}

.logo {
  width: 37px;
  height: 37px;
  background: linear-gradient(135deg,#a58bff,#6246df);
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 20px;
}

.new-chat {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: white;
  border-radius: 11px;
  text-align: left;
  transition: .2s;
}

.new-chat:hover { border-color: var(--accent); }

.section-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  margin: 25px 0 12px;
}

.history {
  overflow-y: auto;
  flex: 1;
}

.history-item {
  padding: 11px;
  border-radius: 9px;
  color: #c4c8d2;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}

.history-item:hover,
.history-item.active {
  background: var(--panel2);
  color: white;
}

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding-top: 15px;
}

.settings-btn {
  width: 100%;
  background: transparent;
  color: #d5d7e0;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px;
  text-align: left;
}

.settings-btn:hover { background: var(--panel2); }

/* MAIN */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 70px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  gap: 12px;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar h3 {
  font-size: 15px;
  margin: 0;
}

.model-select {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: white;
  padding: 9px 12px;
  border-radius: 9px;
  outline: none;
  max-width: 220px;
}

.status {
  font-size: 12px;
  color: #a9b0bf;
}

.status::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #36ce91;
  border-radius: 50%;
  margin-right: 7px;
}

/* CHAT */

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 35px 20px;
  scroll-behavior: smooth;
}

.chat-content {
  max-width: 820px;
  margin: auto;
}

.welcome {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 35px 10px;
}

.welcome-icon {
  font-size: 43px;
  margin-bottom: 18px;
}

.welcome h1 {
  font-size: clamp(27px,4vw,39px);
  margin: 0 0 12px;
  letter-spacing: -1.5px;
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
  width: 100%;
  margin-top: 30px;
}

.suggestion {
  border: 1px solid var(--border);
  background: var(--panel);
  color: #d7d9e2;
  border-radius: 12px;
  padding: 16px;
  text-align: left;
  font-size: 13px;
  line-height: 1.5;
}

.suggestion:hover {
  border-color: var(--accent);
  background: var(--panel2);
}

.message {
  display: flex;
  gap: 13px;
  margin-bottom: 28px;
  align-items: flex-start;
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  background: var(--panel2);
  font-size: 15px;
}

.message.user .avatar {
  background: var(--user);
}

.message-body {
  flex: 1;
  min-width: 0;
  line-height: 1.75;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.message.user .message-body {
  background: var(--user);
  padding: 12px 16px;
  border-radius: 4px 13px 13px 13px;
}

.message-body p { margin: 0 0 12px; }
.message-body p:last-child { margin-bottom: 0; }

.message-body pre {
  background: #080a10;
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
}

.message-body code {
  background: #252938;
  padding: 2px 5px;
  border-radius: 4px;
}

.message-body pre code {
  background: transparent;
  padding: 0;
}

.message-body a { color: #ae9bff; }

.message-body ul, .message-body ol {
  padding-left: 22px;
}

.copy-btn {
  margin-top: 9px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 7px;
  padding: 5px 9px;
  font-size: 11px;
}

.copy-btn:hover { color: white; }

.typing {
  color: var(--muted);
  font-size: 13px;
  padding: 8px 0;
}

/* INPUT */

.input-wrapper {
  padding: 15px 20px 20px;
  background: linear-gradient(transparent,var(--bg) 30%);
}

.input-box {
  max-width: 820px;
  margin: auto;
  background: var(--panel2);
  border: 1px solid #34394b;
  border-radius: 17px;
  padding: 12px 13px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.input-box:focus-within {
  border-color: var(--accent);
}

#userInput {
  flex: 1;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  resize: none;
  min-height: 27px;
  max-height: 160px;
  padding: 5px;
  line-height: 1.5;
  font-size: 14px;
}

#userInput::placeholder { color: #7e8495; }

.send-btn {
  width: 39px;
  height: 39px;
  border: none;
  background: var(--accent);
  color: white;
  border-radius: 11px;
  font-size: 18px;
}

.send-btn:hover { background: var(--accent2); }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }

.footer-note {
  text-align: center;
  font-size: 10px;
  color: #777e8e;
  margin-top: 11px;
}

/* SETTINGS MODAL */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: #000b;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 15px;
}

.modal-overlay.show { display: flex; }

.modal {
  background: #151924;
  border: 1px solid var(--border);
  border-radius: 17px;
  width: 100%;
  max-width: 440px;
  padding: 25px;
  box-shadow: 0 20px 80px #0009;
}

.modal h2 { margin: 0 0 8px; font-size: 21px; }
.modal p { color: var(--muted); font-size: 13px; line-height: 1.6; }

.field-label {
  display: block;
  font-size: 12px;
  margin: 19px 0 8px;
  color: #d5d8e2;
}

.key-row {
  display: flex;
  gap: 7px;
}

.field {
  width: 100%;
  background: #0d1018;
  border: 1px solid var(--border);
  color: white;
  padding: 12px;
  border-radius: 9px;
  outline: none;
}

.field:focus { border-color: var(--accent); }

.small-btn {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 0 12px;
}

.save-option {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  font-size: 12px;
  color: #b9bdca;
}

.modal-actions {
  display: flex;
  gap: 9px;
  margin-top: 23px;
}

.primary-btn, .secondary-btn {
  padding: 11px 15px;
  border-radius: 9px;
  border: none;
  font-size: 13px;
}

.primary-btn {
  flex: 1;
  background: var(--accent);
  color: white;
}

.secondary-btn {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
}

#toast {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #242a38;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 13px;
  display: none;
  z-index: 20;
  max-width: 90vw;
}

/* MOBILE */

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    z-index: 5;
    left: -280px;
    top: 0;
    bottom: 0;
    transition: .25s;
  }

  .sidebar.open { left: 0; }

  .topbar { padding: 0 12px; }
  .topbar h3 { display: none; }
  .model-select { max-width: 175px; font-size: 11px; }
  .chat-area { padding: 22px 13px; }
  .input-wrapper { padding: 10px 12px 14px; }
  .suggestions { grid-template-columns: 1fr; }
  .menu-btn { display: block !important; }
}

.menu-btn {
  display: none;
  background: transparent;
  border: 1px solid var(--border);
  color: white;
  border-radius: 8px;
  padding: 7px 10px;
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">✦</div>
      Omni AI
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ &nbsp; New Chat
    </button>

    <div class="section-label">RECENT CHATS</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <button class="settings-btn" onclick="openSettings()">
        ⚙ &nbsp; API Settings
      </button>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <div class="top-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h3>AI Assistant</h3>

        <select class="model-select" id="modelSelect"
                onchange="changeModel()">

          <optgroup label="OpenAI GPT Models">
            <option value="openai/gpt-oss-20b">
              GPT-OSS 20B
            </option>
            <option value="openai/gpt-oss-120b">
              GPT-OSS 120B
            </option>
          </optgroup>

          <optgroup label="Meta Llama Models">
            <option value="llama-3.3-70b-versatile">
              Llama 3.3 70B
            </option>
            <option value="llama-3.1-8b-instant">
              Llama 3.1 8B
            </option>
          </optgroup>

        </select>
      </div>

      <div class="status" id="status">Ready</div>

    </header>

    <section class="chat-area" id="chatArea">
      <div class="chat-content" id="chatContent"></div>
    </section>

    <footer class="input-wrapper">

      <div class="input-box">

        <textarea id="userInput"
          rows="1"
          placeholder="Message Omni AI..."
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"></textarea>

        <button class="send-btn" id="sendBtn"
          onclick="sendMessage()">↑</button>

      </div>

      <div class="footer-note">
        Omni AI can make mistakes. Check important information.
      </div>

    </footer>

  </main>
</div>

<!-- SETTINGS MODAL -->

<div class="modal-overlay" id="settingsModal">

  <div class="modal">

    <h2>⚙ API Settings</h2>

    <p>
      Connect your Groq API key to start chatting with AI models.
    </p>

    <label class="field-label">Groq API Key</label>

    <div class="key-row">
      <input type="password" id="apiKey"
        class="field" placeholder="gsk_..."
        autocomplete="off">

      <button class="small-btn" onclick="toggleKeyVisibility()">
        Show
      </button>
    </div>

    <label class="save-option">
      <input type="checkbox" id="saveKey">
      Save API key in this browser
    </label>

    <p>
      If unchecked, the key will only remain in memory until you
      close or reload the page.
    </p>

    <p>
      <a href="https://console.groq.com/keys"
         target="_blank" rel="noopener"
         style="color:#a995ff">
        Get your Groq API Key ↗
      </a>
    </p>

    <div class="modal-actions">

      <button class="secondary-btn" onclick="closeSettings()">
        Cancel
      </button>

      <button class="secondary-btn" onclick="removeKey()">
        Remove Key
      </button>

      <button class="primary-btn" onclick="saveSettings()">
        Save Settings
      </button>

    </div>

  </div>
</div>

<div id="toast"></div>

<script>

/* ==========================
   CONFIGURATION
========================== */

const API_URL =
  "https://api.groq.com/openai/v1/chat/completions";

const STORAGE_KEY = "omni_ai_chats_v1";

let apiKey = "";
let currentChatId = null;
let chats = [];
let isLoading = false;

let currentModel =
  "openai/gpt-oss-20b";

const SYSTEM_PROMPT = {
  role: "system",
  content: "You are Omni AI, a helpful, intelligent and friendly assistant. Answer clearly and accurately. Support English, Hindi and Hinglish. Use Markdown formatting when helpful."
};

/* ==========================
   INITIALIZATION
========================== */

function init() {

  const savedKey = localStorage.getItem("omni_api_key");

  if (savedKey) {
    apiKey = savedKey;
    document.getElementById("saveKey").checked = true;
  }

  chats = loadChats();

  if (chats.length > 0) {
    currentChatId = chats[0].id;
    renderChat();
  } else {
    newChat();
  }

  renderHistory();

  if (!apiKey) {
    openSettings();
  }

}

function loadChats() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function persistChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  } catch (error) {
    showToast("Chat storage is full. Delete some old chats.");
  }
}

function getCurrentChat() {
  return chats.find(c => c.id === currentChatId);
}

/* ==========================
   CHAT MANAGEMENT
========================== */

function newChat() {

  currentChatId = Date.now().toString();

  chats.unshift({
    id: currentChatId,
    title: "New Chat",
    messages: [],
    model: currentModel
  });

  persistChats();
  renderChat();
  renderHistory();

  document.getElementById("userInput").focus();

  if (window.innerWidth <= 700) {
    document.getElementById("sidebar").classList.remove("open");
  }
}

function deleteChat(id, event) {

  if (event) event.stopPropagation();

  chats = chats.filter(c => c.id !== id);

  if (currentChatId === id) {
    currentChatId = null;

    if (chats.length) {
      currentChatId = chats[0].id;
    } else {
      newChat();
    }
  }

  persistChats();
  renderChat();
  renderHistory();
}

function selectChat(id) {

  currentChatId = id;

  const chat = getCurrentChat();

  if (chat && chat.model) {
    currentModel = chat.model;
    document.getElementById("modelSelect").value = currentModel;
  }

  renderChat();
  renderHistory();

  document.getElementById("sidebar").classList.remove("open");
}

function renderHistory() {

  const history = document.getElementById("history");

  history.innerHTML = "";

  chats.forEach(chat => {

    const item = document.createElement("div");
    item.className =
      "history-item" +
      (chat.id === currentChatId ? " active" : "");

    item.textContent = "💬 " + chat.title;

    item.title = chat.title;

    item.onclick = () => selectChat(chat.id);

    item.oncontextmenu = (e) => {
      e.preventDefault();
      if (confirm("Delete this chat?")) {
        deleteChat(chat.id);
      }
    };

    history.appendChild(item);

  });

}

function renderChat() {

  const content = document.getElementById("chatContent");
  const chat = getCurrentChat();

  content.innerHTML = "";

  if (!chat || !chat.messages.length) {

    content.innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">✦</div>
        <h1>How can I help you today?</h1>
        <p>
          Your intelligent AI assistant powered by Groq.<br>
          Choose GPT-OSS or Llama and start a conversation.
        </p>

        <div class="suggestions">

          <button class="suggestion"
            onclick="useSuggestion('Explain artificial intelligence in simple words')">
            ✨ Explain AI<br>
            <span style="color:#9299aa">Learn something new</span>
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Write a professional website using HTML CSS and JavaScript')">
            💻 Write Code<br>
            <span style="color:#9299aa">Build your next project</span>
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Give me 5 creative startup ideas')">
            🚀 Startup Ideas<br>
            <span style="color:#9299aa">Explore new possibilities</span>
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Help me create a daily productivity plan')">
            🎯 Productivity<br>
            <span style="color:#9299aa">Plan your day</span>
          </button>

        </div>
      </div>
    `;

    return;
  }

  chat.messages.forEach((msg, index) => {
    addMessageToDOM(msg.role, msg.content, index);
  });

  scrollToBottom();
}

function addMessageToDOM(role, content, index) {

  const contentArea = document.getElementById("chatContent");

  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "👤" : "✦";

  const body = document.createElement("div");
  body.className = "message-body";

  if (role === "assistant") {

    const rendered = document.createElement("div");

    try {
      const html = marked.parse(content || "");
      rendered.innerHTML = DOMPurify.sanitize(html);
    } catch {
      rendered.textContent = content;
    }

    body.appendChild(rendered);

    const copy = document.createElement("button");
    copy.className = "copy-btn";
    copy.textContent = "▢ Copy";

    copy.onclick = () => {
      copyText(content);
    };

    body.appendChild(copy);

  } else {

    body.textContent = content;

  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(body);

  contentArea.appendChild(wrapper);
}

function appendMessage(role, text) {
  addMessageToDOM(role, text, 0);
  scrollToBottom();
}

function scrollToBottom() {
  const area = document.getElementById("chatArea");
  area.scrollTop = area.scrollHeight;
}

/* ==========================
   MODEL MANAGEMENT
========================== */

function changeModel() {

  currentModel =
    document.getElementById("modelSelect").value;

  const chat = getCurrentChat();

  if (chat) {
    chat.model = currentModel;
    persistChats();
  }

  showToast("Model changed successfully");
}

/* ==========================
   MESSAGE INPUT
========================== */

function useSuggestion(text) {
  document.getElementById("userInput").value = text;
  sendMessage();
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

function handleKey(event) {

  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }

}

/* ==========================
   SEND MESSAGE
========================== */

async function sendMessage() {

  if (isLoading) return;

  const input = document.getElementById("userInput");
  const text = input.value.trim();

  if (!text) return;

  if (!apiKey) {
    openSettings();
    showToast("Please add your Groq API key first");
    return;
  }

  let chat = getCurrentChat();

  if (!chat) {
    newChat();
    chat = getCurrentChat();
  }

  input.value = "";
  input.style.height = "auto";

  chat.messages.push({
    role: "user",
    content: text
  });

  if (chat.messages.length === 1) {
    chat.title = text.substring(0, 35) +
      (text.length > 35 ? "..." : "");
  }

  chat.model = currentModel;

  persistChats();

  renderChat();
  renderHistory();

  isLoading = true;

  const sendBtn = document.getElementById("sendBtn");
  const status = document.getElementById("status");

  sendBtn.disabled = true;
  sendBtn.textContent = "…";
  status.textContent = "Thinking...";

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typingIndicator";
  typing.textContent = "✦ Omni AI is thinking...";

  document.getElementById("chatContent").appendChild(typing);

  scrollToBottom();

  try {

    const messages = [
      SYSTEM_PROMPT,
      ...chat.messages
    ];

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + apiKey
      },

      body: JSON.stringify({

        model: currentModel,
        messages: messages,
        temperature: 0.7,
        max_completion_tokens: 4096,
        stream: false

      })

    });

    const data = await response.json();

    if (!response.ok) {

      const errorMessage =
        data?.error?.message ||
        "API request failed. Check your API key and model.";

      throw new Error(errorMessage);
    }

    const reply =
      data?.choices?.[0]?.message?.content;

    if (!reply) {
      throw new Error("Empty response received from Groq.");
    }

    chat.messages.push({
      role: "assistant",
      content: reply
    });

    persistChats();

    document.getElementById("typingIndicator")?.remove();

    renderChat();

    showToast("Response received ✓");

  } catch (error) {

    document.getElementById("typingIndicator")?.remove();

    const errorText = "⚠️ " + error.message;

    appendMessage("assistant", errorText);

    showToast("Something went wrong");

    console.error("Groq API Error:", error);

  } finally {

    isLoading = false;

    sendBtn.disabled = false;
    sendBtn.textContent = "↑";

    status.textContent = "Ready";

    input.focus();

  }

}

/* ==========================
   API SETTINGS
========================== */

function openSettings() {

  document.getElementById("apiKey").value = apiKey;

  document.getElementById("settingsModal")
    .classList.add("show");

}

function closeSettings() {

  document.getElementById("settingsModal")
    .classList.remove("show");

}

function saveSettings() {

  const enteredKey =
    document.getElementById("apiKey").value.trim();

  const save =
    document.getElementById("saveKey").checked;

  if (!enteredKey) {
    showToast("Please enter an API key");
    return;
  }

  if (!enteredKey.startsWith("gsk_")) {
    showToast("Please check your Groq API key format");
    return;
  }

  apiKey = enteredKey;

  if (save) {
    localStorage.setItem("omni_api_key", apiKey);
  } else {
    localStorage.removeItem("omni_api_key");
  }

  closeSettings();

  showToast("API settings saved ✓");

}

function removeKey() {

  apiKey = "";

  localStorage.removeItem("omni_api_key");

  document.getElementById("apiKey").value = "";
  document.getElementById("saveKey").checked = false;

  showToast("API key removed");

}

function toggleKeyVisibility() {

  const field = document.getElementById("apiKey");

  field.type =
    field.type === "password" ? "text" : "password";

}

/* ==========================
   UTILITIES
========================== */

function copyText(text) {

  navigator.clipboard.writeText(text)
    .then(() => showToast("Copied to clipboard ✓"))
    .catch(() => showToast("Copy failed"));

}

function showToast(message) {

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 3000);

}

function toggleSidebar() {
  document.getElementById("sidebar")
    .classList.toggle("open");
}

/* START APP */

init();

</script>
